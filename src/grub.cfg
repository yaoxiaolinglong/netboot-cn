# GRUB 中文网络启动菜单
#
# 设计原则：
#   1. 直连安装的条目，内核和 initrd 在启动时从镜像站 HTTP 拉取，本地不存任何镜像
#   2. 只收录 initrd 小于 100 MB 的发行版（GRUB 的 http 模块扛不住几百 MB）
#   3. 其余系统统一走 netboot.xyz（iPXE 引擎，网络性能好，但菜单只有英文）
#
# 修改菜单后必须重新构建 EFI，因为配置是内嵌在二进制里的

set timeout=30
set default=0

insmod all_video
insmod gfxterm
insmod font

loadfont /boot/grub/fonts/ascii.pf2
if loadfont /boot/grub/fonts/cn.pf2 ; then
  set gfxmode=1024x768,800x600,auto
  set gfxpayload=keep
  terminal_output gfxterm
fi

set menu_color_normal=cyan/black
set menu_color_highlight=black/light-gray
set color_normal=light-gray/black
set timeout_style=menu

# ─────────────────────────────────────────────
#  直连网络安装（全中文安装器）
# ─────────────────────────────────────────────

menuentry "① Debian 13 · 清华源 · 简体中文安装器" {
    insmod http
    insmod net
    insmod efinet
    net_bootp
    set pfx=/debian/dists/stable/main/installer-amd64/current/images/netboot/debian-installer/amd64
    linux (http,101.6.15.130)$pfx/linux debian-installer/language=zh_CN debian-installer/country=CN debian-installer/locale=zh_CN.UTF-8 debian-installer/keymap=us
    initrd (http,101.6.15.130)$pfx/initrd.gz
}

menuentry "② Debian 13 · 中科大源 · 简体中文安装器" {
    insmod http
    insmod net
    insmod efinet
    net_bootp
    set pfx=/debian/dists/stable/main/installer-amd64/current/images/netboot/debian-installer/amd64
    linux (http,202.141.160.110)$pfx/linux debian-installer/language=zh_CN debian-installer/country=CN debian-installer/locale=zh_CN.UTF-8 debian-installer/keymap=us
    initrd (http,202.141.160.110)$pfx/initrd.gz
}

menuentry "③ Alpine Linux · 超轻量 · 命令行安装（英文）" {
    insmod http
    insmod net
    insmod efinet
    net_bootp
    set apfx=/alpine/latest-stable/releases/x86_64/netboot
    linux (http,101.6.15.130)$apfx/vmlinuz-lts modules=loop,squashfs,sd-mod,usb-storage alpine_repo=http://101.6.15.130/alpine/latest-stable/main
    initrd (http,101.6.15.130)$apfx/initramfs-lts
}

menuentry "④ CentOS Stream 10 · 英文安装器（首次加载较慢）" {
    insmod http
    insmod net
    insmod efinet
    net_bootp
    set cpfx=/centos-stream/10-stream/BaseOS/x86_64/os/images/pxeboot
    linux (http,202.141.160.110)$cpfx/vmlinuz inst.repo=http://202.141.160.110/centos-stream/10-stream/BaseOS/x86_64/os/
    initrd (http,202.141.160.110)$cpfx/initrd.img
}

# ─────────────────────────────────────────────
#  Windows（必须自备 ISO）
# ─────────────────────────────────────────────

menuentry "⑤ 安装 Windows · 需自备 ISO 的 HTTP 地址" {
    search --no-floppy --file --set=root /netboot.xyz.efi
    chainloader /netboot.xyz.efi
}

# ─────────────────────────────────────────────
#  全部系统
# ─────────────────────────────────────────────

menuentry "⑥ netboot.xyz · 90+ 系统 · 英文菜单" {
    search --no-floppy --file --set=root /netboot.xyz.efi
    chainloader /netboot.xyz.efi
}

# ─────────────────────────────────────────────
#  其他
# ─────────────────────────────────────────────

menuentry "⑦ 从本地硬盘启动" {
    search --no-floppy --file --set=root /EFI/boot/bootx64.efi
    exit
}

menuentry "⑧ 重启" {
    reboot
}
