# GRUB 中文网络启动菜单
#
# 三条设计规则：
#   1. 内核优先从 U 盘本地读（/images/<distro>/），读不到才联网
#      —— 这样引导阶段不需要任何网络，笔记本可以全程用 WiFi
#   2. Debian 的 initrd 已经注入 non-free 无线固件（见 scripts/fetch-images.sh）
#      —— 安装器里能直接连 WiFi
#   3. 其余系统走 netboot.xyz（iPXE 引擎，网络性能好，但菜单只有英文）
#
# 镜像 IP 硬编码：GRUB 没有 dns 模块，只能填 IP
#   清华 101.6.15.130  /  中科大 202.141.160.110
#
# 改完必须重新 build.sh，配置内嵌在 EFI 里

set timeout=30
set default=0

insmod all_video
insmod gfxterm
insmod font

loadfont /boot/grub/fonts/ascii.pf2
if loadfont /boot/grub/fonts/cn.pf2 ; then
  set gfxmode=1024x768,800x600,auto
  set gfxpayload=keep
  terminal_output gfxterm
fi

set menu_color_normal=cyan/black
set menu_color_highlight=black/light-gray
set color_normal=light-gray/black
set timeout_style=menu

# ─────────────────────────────────────────────
#  ① Debian：本地内核优先，没有则清华源，再没有则中科大
# ─────────────────────────────────────────────

menuentry "① Debian 13 · 简体中文安装器（全程可无线）" {
    set dparams="debian-installer/language=zh_CN debian-installer/country=CN debian-installer/locale=zh_CN.UTF-8 debian-installer/keymap=us"

    if search --no-floppy --file --set=root /images/debian/linux ; then
        linux /images/debian/linux $dparams
        initrd /images/debian/initrd.gz
    elif search --no-floppy --file --set=root /images/debian/initrd.gz ; then
        linux /images/debian/linux $dparams
        initrd /images/debian/initrd.gz
    else
        insmod http
        insmod net
        insmod efinet
        net_bootp
        set pfx=/debian/dists/stable/main/installer-amd64/current/images/netboot/debian-installer/amd64
        linux (http,101.6.15.130)$pfx/linux $dparams
        initrd (http,101.6.15.130)$pfx/initrd.gz
    fi
}

# ─────────────────────────────────────────────
#  ② Alpine
# ─────────────────────────────────────────────

menuentry "② Alpine Linux · 超轻量 · 命令行（全程可无线）" {
    if search --no-floppy --file --set=root /images/alpine/linux ; then
        linux /images/alpine/linux modules=loop,squashfs,sd-mod,usb-storage alpine_repo=http://101.6.15.130/alpine/latest-stable/main
        initrd /images/alpine/initrd.gz
    else
        insmod http
        insmod net
        insmod efinet
        net_bootp
        set apfx=/alpine/latest-stable/releases/x86_64/netboot
        linux (http,101.6.15.130)$apfx/vmlinuz-lts modules=loop,squashfs,sd-mod,usb-storage alpine_repo=http://101.6.15.130/alpine/latest-stable/main
        initrd (http,101.6.15.130)$apfx/initramfs-lts
    fi
}

# ─────────────────────────────────────────────
#  ③ CentOS Stream
# ─────────────────────────────────────────────

menuentry "③ CentOS Stream 10 · 英文安装器（全程可无线）" {
    if search --no-floppy --file --set=root /images/centos/linux ; then
        linux /images/centos/linux inst.repo=http://202.141.160.110/centos-stream/10-stream/BaseOS/x86_64/os/
        initrd /images/centos/initrd.gz
    else
        insmod http
        insmod net
        insmod efinet
        net_bootp
        set cpfx=/centos-stream/10-stream/BaseOS/x86_64/os/images/pxeboot
        linux (http,202.141.160.110)$cpfx/vmlinuz inst.repo=http://202.141.160.110/centos-stream/10-stream/BaseOS/x86_64/os/
        initrd (http,202.141.160.110)$cpfx/initrd.img
    fi
}

# ─────────────────────────────────────────────
#  Windows（wimboot 需要 iPXE，必须自备 ISO）
# ─────────────────────────────────────────────

menuentry "④ 安装 Windows · 需自备 ISO 的 HTTP 地址" {
    search --no-floppy --file --set=root /netboot.xyz.efi
    chainloader /netboot.xyz.efi
}

# ─────────────────────────────────────────────
#  全部系统（iPXE）
# ─────────────────────────────────────────────

menuentry "⑤ netboot.xyz · 90+ 系统 · 英文菜单（需网线）" {
    search --no-floppy --file --set=root /netboot.xyz.efi
    chainloader /netboot.xyz.efi
}

# ─────────────────────────────────────────────
#  其他
# ─────────────────────────────────────────────

menuentry "⑥ 从本地硬盘启动" {
    search --no-floppy --file --set=root /EFI/boot/bootx64.efi
    exit
}

menuentry "⑦ 重启" {
    reboot
}
